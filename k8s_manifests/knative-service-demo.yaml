# Demo profile: minScale 0 so the audience sees a real scale-to-zero and a
# cold start. Not meant for production traffic — see knative-service-production.yaml.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: iris-classifier
  namespace: inference
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "10"
        # Target in-flight requests per pod before the autoscaler adds another.
        autoscaling.knative.dev/target: "20"
        # How long an idle revision stays up before scaling to zero.
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "30s"
    spec:
      # Node placement: the system managed node group (eks.tf) carries a
      # node-role=system:NoSchedule taint, so these pods can never land there.
      # They schedule only on Karpenter-provisioned application nodes
      # (karpenter.tf), triggering a new node when none exist yet.
      containerConcurrency: 20
      # 60s, not Knative's usual 30s default: when Karpenter has to launch a
      # brand-new EC2 instance for the first request after a full scale-down
      # (no warm application node left), node launch-to-Ready alone measured
      # ~31s in testing, before the pod even starts — see README "Cold start
      # has two very different regimes" for real numbers.
      timeoutSeconds: 60
      containers:
        - image: IMAGE_URI_PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
