# Picked up by kube-prometheus-stack (see monitoring/prometheus-values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iris-classifier
  namespace: inference
spec:
  selector:
    matchLabels:
      serving.knative.dev/service: iris-classifier
  namespaceSelector:
    matchNames: ["inference"]
  endpoints:
    - port: http-usermetric
      path: /metrics
      interval: 15s
